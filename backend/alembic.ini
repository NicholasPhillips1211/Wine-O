# Alembic Configuration

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(created_at)s_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to datestamp() function from sqlalchemy.sql import sqltypes
# Leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field if truncating of the slug is needed.
# Examples: "pre_prd", "xyzabcdefghijklmnop", ""
# truncate_slug_len = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# logging configuration
# Loggers to configure
#
# Keys to use when announcing the operations on the console:
#
# - individual: whether each script gets outputted
#   false   [default]: rollback, invoke alembic revision
#            commands, etc. emit one log line per line
#            of output
#   true    : the filename is printed for each line
#             of output set by revision, history
#             scripts.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = sqlite:///./wine_o.db

[migration]
# set this to 'true' to enable the -x flag in revision,
# new_revision, etc. commands to pass additional user defined
# vars to the template engine
# user_locals =
